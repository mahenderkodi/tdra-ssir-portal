<div class="portal-shell">

  <header class="content-header">

    <div class="container-fluid h-100">

      <div class="row h-100 align-items-center ">

        <!-- LEFT: PORTAL IDENTITY -->
        <div class="col-8 col-lg-4 h-100 d-flex align-items-center">

          <div class="logo">

            <a
              routerLink="/portal"
              class="text-decoration-none"
            >

              <div class="d-flex align-items-center gap-2">

                <div class="portal-brand-title">
                  {{ 'portal.layout.senderRegistry' | translate }}
                </div>

                <div class="portal-brand-subtitle">
                  {{ 'portal.layout.companyPortal' | translate }}
                </div>

              </div>

            </a>

          </div>

        </div>


        <!-- RIGHT -->
        <div
          class="
            col-4
            col-lg-8
            h-100
            d-flex
            align-items-center
            justify-content-end
          "
        >

          <div
            class="
              d-none
              d-lg-flex
              align-items-center
              justify-content-end
            "
          >

            <a
              href="#"
              class="login"
              (click)="logout(); $event.preventDefault()"
            >
              {{ 'portal.layout.signOut' | translate }}
            </a>

          </div>

          <a
            href="#"
            class="burger d-lg-none"
            [class.active]="mobileMenuOpen"
            (click)="toggleMobileMenu(); $event.preventDefault()"
            [attr.aria-label]="
              'portal.layout.openNavigationMenu'
                | translate
            "
          ></a>

        </div>

      </div>

    </div>


    <!-- MOBILE MENU -->
    @if (mobileMenuOpen) {

      <div
        class="mobile-menu d-block d-lg-none h-auto py-3"
        style="min-height: 0;"
      >

        <nav
          role="navigation"
          aria-labelledby="portal-mobile-navigation"
          class="w-100"
        >

          <h2
            class="visually-hidden"
            id="portal-mobile-navigation"
          >
            {{ 'portal.layout.mobileNavigation' | translate }}
          </h2>

          <div
            class="
              d-flex
              w-100
              justify-content-center
              align-items-center
            "
          >

            <a
              href="#"
              class="login"
              (click)="logout(); $event.preventDefault()"
            >
              {{ 'portal.layout.signOut' | translate }}
            </a>

          </div>

        </nav>

      </div>

    }

  </header>


  <!-- PAGE CONTENT -->
  <main class="portal-content p-2">

    <router-outlet>
    </router-outlet>

  </main>

</div>
