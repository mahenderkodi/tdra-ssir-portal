<div class="admin-wrapper d-flex">

  <!-- Sidebar -->
  <aside
    class="admin-sidebar"
    [class.sidebar-open]="sidebarOpen()"
  >

    <!-- Header -->
    <div
      class="
        sidebar-header
        d-flex
        align-items-center
        gap-3
        p-4
      "
    >

      <div
        class="
          logo-badge
          rounded-3
          d-flex
          align-items-center
          justify-content-center
        "
      >
        TR
      </div>


      <div>
        <h5
          class="
            sidebar-title
            mb-0
            fw-bold
          "
        >
          TDRA SSIR
        </h5>

        <span
          class="
            sidebar-subtitle
            small
          "
        >
          Admin Control Room
        </span>
      </div>

    </div>


    <!-- Navigation -->
    <nav
      class="
        nav
        flex-column
        gap-2
        px-3
        pt-3
        flex-grow-1
      "
    >

      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        class="
          sidebar-link
          px-3
          py-2-5
          d-flex
          align-items-center
          gap-3
        "
        (click)="closeSidebar()"
      >
        <span class="nav-icon">
          📊
        </span>

        <span class="nav-text">
          Dashboard
        </span>
      </a>


      <a
        routerLink="/admin/registrations"
        routerLinkActive="active"
        class="
          sidebar-link
          px-3
          py-2-5
          d-flex
          align-items-center
          gap-3
        "
        (click)="closeSidebar()"
      >
        <span class="nav-icon">
          📥
        </span>

        <span class="nav-text">
          Onboarding Queue
        </span>
      </a>


      <a
        routerLink="/admin/users"
        routerLinkActive="active"
        class="
          sidebar-link
          px-3
          py-2-5
          d-flex
          align-items-center
          gap-3
        "
        (click)="closeSidebar()"
      >
        <span class="nav-icon">
          👥
        </span>

        <span class="nav-text">
          Manage Staff
        </span>
      </a>

    </nav>


    <!-- Footer -->
    <div class="sidebar-footer p-4">

      <div
        class="
          d-flex
          align-items-center
          gap-3
          mb-3
        "
      >

        <div
          class="
            avatar
            rounded-circle
            d-flex
            align-items-center
            justify-content-center
            fw-semibold
          "
        >
          A
        </div>


        <div class="overflow-hidden">

          <div
            class="
              fw-bold
              text-truncate
              text-white
              small
            "
          >
            {{ currentUser()?.username || 'Admin' }}
          </div>

          <div
            class="
              user-role
              small
              text-truncate
            "
          >
            ROLE_TDRA_ADMIN
          </div>

        </div>

      </div>


      <button
        type="button"
        class="
          btn
          logout-btn
          w-100
          btn-sm
          fw-semibold
        "
        (click)="logout()"
      >
        Sign Out
      </button>

    </div>

  </aside>


  <!-- Mobile overlay -->
  <div
    class="sidebar-overlay"
    [class.show]="sidebarOpen()"
    (click)="closeSidebar()"
  ></div>


  <!-- Main -->
  <div class="flex-grow-1">

    <!-- Mobile Header -->
    <header class="mobile-admin-header">

      <button
        type="button"
        class="menu-button"
        (click)="toggleSidebar()"
        aria-label="Open navigation menu"
      >
        ☰
      </button>


      <div class="mobile-brand">
        TDRA SSIR
      </div>


      <!-- Keeps title visually centered -->
      <div style="width: 42px;"></div>

    </header>


    <!-- Page Content -->
    <main
      class="
        admin-main
        p-4
      "
    >
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
