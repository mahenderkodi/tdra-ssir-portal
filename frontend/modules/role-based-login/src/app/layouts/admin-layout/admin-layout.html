<div class="admin-wrapper">

  <!-- =====================================
       ICONectiv ADMIN HEADER
       ===================================== -->
  <header class="content-header clearfix">

    <div class="container-fluid h-100">

      <div class="row h-100 align-items-center">

        <!-- Logo / Product Name -->
        <div
          class="
            col-8
            col-lg-4
            h-100
            d-flex
            align-items-center
          "
        >

          <div class="logo">

            <a
              routerLink="/admin/dashboard"
              class="text-decoration-none"
            >

              <div class="d-flex align-items-center gap-2">

                <span class="fw-bold text-white">
                  TDRA SSIR
                </span>

                <span class="small text-secondary">
                  Admin
                </span>

              </div>

            </a>

          </div>

        </div>


        <!-- Desktop Navigation -->
        <div
          class="
            col-4
            col-lg-8
            h-100
            d-flex
            align-items-center
            justify-content-end
          "
        >

          <nav
            role="navigation"
            aria-labelledby="block-icon-main-menu-menu"
            id="block-icon-main-menu"
          >

            <h2
              class="visually-hidden"
              id="block-icon-main-menu-menu"
            >
              Main navigation
            </h2>


            <ul class="menu">

              <li class="menu-item">

                <a
                  routerLink="/admin/dashboard"
                  routerLinkActive="is-active"
                  [routerLinkActiveOptions]="{
                    exact: true
                  }"
                >
                  Dashboard
                </a>

              </li>


              <li class="menu-item">

                <a
                  routerLink="/admin/registrations"
                  routerLinkActive="is-active"
                >
                  Onboarding Queue
                </a>

              </li>


              <li class="menu-item">

                <a
                  routerLink="/admin/users"
                  routerLinkActive="is-active"
                >
                  Manage Staff
                </a>

              </li>

            </ul>

          </nav>


          <!-- Desktop Log Out -->
          <div
            class="
              d-none
              d-lg-flex
              justify-content-center
              align-items-baseline
            "
          >

            <a
              href="#"
              class="login"
              (click)="
                logout();
                $event.preventDefault()
              "
            >
              Log Out
            </a>

          </div>

        </div>

      </div>

    </div>


    <!-- =====================================
         MOBILE BURGER
         Keep outside container like guide
         ===================================== -->
    <a
      href="#"
      class="burger d-lg-none"
      [class.active]="sidebarOpen()"
      (click)="
        toggleSidebar();
        $event.preventDefault()
      "
      aria-label="Toggle navigation menu"
    ></a>


    <!-- =====================================
         MOBILE MENU
         ===================================== -->
    @if (sidebarOpen()) {

      <div
        class="
          mobile-menu
          d-block
          d-lg-none
        "
      >

        <nav
          role="navigation"
          aria-labelledby="block-mobilenavigation-menu"
          id="block-mobilenavigation"
        >

          <h2
            class="visually-hidden"
            id="block-mobilenavigation-menu"
          >
            Mobile Navigation
          </h2>


          <ul class="menu">

            <li class="menu-item">

              <a
                routerLink="/admin/dashboard"
                routerLinkActive="is-active"
                [routerLinkActiveOptions]="{
                  exact: true
                }"
                (click)="closeSidebar()"
              >
                Dashboard
              </a>

            </li>


            <li class="menu-item">

              <a
                routerLink="/admin/registrations"
                routerLinkActive="is-active"
                (click)="closeSidebar()"
              >
                Onboarding Queue
              </a>

            </li>


            <li class="menu-item">

              <a
                routerLink="/admin/users"
                routerLinkActive="is-active"
                (click)="closeSidebar()"
              >
                Manage Staff
              </a>

            </li>

          </ul>

        </nav>


        <!-- Mobile Log Out -->
        <div
          class="
            d-flex
            justify-content-center
            align-items-baseline
            pt-3
          "
        >

          <a
            href="#"
            class="login"
            (click)="
              logout();
              $event.preventDefault()
            "
          >
            Log Out
          </a>

        </div>

      </div>

    }

  </header>


  <!-- =====================================
       PAGE CONTENT
       ===================================== -->
  <main class="admin-main p-3 p-md-4">

    <router-outlet></router-outlet>

  </main>

</div>
