<div class="admin-wrapper d-flex">
  <!-- Premium Dark Sidebar [3] -->
  <aside class="admin-sidebar d-flex flex-column text-white shadow-sm">
    <div class="sidebar-header d-flex align-items-center gap-3 p-4">
      <div class="logo-badge bg-primary text-white rounded-3 d-flex align-items-center justify-content-center fw-bold">
        TR
      </div>
      <div>
        <h5 class="mb-0 fw-bold tracking-wide text-white">TDRA SSIR</h5>
        <span class="text-muted small">Admin Control Room</span>
      </div>
    </div>

    <!-- Navigation links [3] -->
    <nav class="nav flex-column gap-2 px-3 flex-grow-1">
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="sidebar-link rounded-3 px-3 py-2-5 d-flex align-items-center gap-3">
        <span class="nav-icon">📊</span>
        <span class="nav-text fw-medium">Dashboard</span>
      </a>
      <a routerLink="/admin/registrations" routerLinkActive="active" class="sidebar-link rounded-3 px-3 py-2-5 d-flex align-items-center gap-3">
        <span class="nav-icon">📥</span>
        <span class="nav-text fw-medium">Onboarding Queue</span>
      </a>
      <a routerLink="/admin/users" routerLinkActive="active" class="sidebar-link rounded-3 px-3 py-2-5 d-flex align-items-center gap-3">
        <span class="nav-icon">👥</span>
        <span class="nav-text fw-medium">Manage Staff</span>
      </a>
    </nav>

    <!-- Footer Profile Panel [3] -->
    <div class="sidebar-footer p-4 border-top border-secondary-subtle">
      <div class="d-flex align-items-center gap-3 mb-3">
        <div class="avatar bg-secondary text-white rounded-circle d-flex align-items-center justify-content-center fw-semibold">
          A
        </div>
        <div class="user-meta overflow-hidden">
          <div class="fw-bold text-truncate text-white small">{{ currentUser()?.username || 'Admin' }}</div>
          <div class="text-muted small text-truncate">ROLE_TDRA_ADMIN</div>
        </div>
      </div>
      <button class="btn btn-outline-danger w-100 btn-sm fw-semibold" (click)="logout()">Sign Out</button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="admin-main flex-grow-1 p-4 bg-light overflow-auto">
    <router-outlet></router-outlet>
  </main>
</div>
