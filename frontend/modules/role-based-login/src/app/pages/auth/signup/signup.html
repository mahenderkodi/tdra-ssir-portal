<div class="card shadow border-0">

  <div
    class="
      card-header
      bg-primary
      text-white
      text-center
      p-4
      rounded-top
    "
  >
    <h3 class="mb-0 fw-bold">
      Create Account
    </h3>

    <p class="small mb-0 text-white-50 mt-1">
      TDRA SMS Sender ID Registry Portal
    </p>
  </div>


  <div class="card-body p-4">

    @if (errorMessage()) {
      <div
        class="alert alert-danger small"
        role="alert"
      >
        {{ errorMessage() }}
      </div>
    }


    <form
      [formGroup]="signupForm"
      (ngSubmit)="onSubmit()"
    >

      <div class="mb-3">
        <label class="form-label fw-bold small">
          Email
          <span class="text-danger">*</span>
        </label>

        <input
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="name@company.com"
        />
      </div>


      <div class="mb-3">
        <label class="form-label fw-bold small">
          Username
          <span class="text-danger">*</span>
        </label>

        <input
          type="text"
          class="form-control"
          formControlName="username"
          placeholder="fatima_nova"
        />
      </div>


      <div class="mb-4">
        <label class="form-label fw-bold small">
          Password
          <span class="text-danger">*</span>
        </label>

        <input
          type="password"
          class="form-control"
          formControlName="password"
          placeholder="••••••••"
        />
      </div>


      <div class="d-grid mb-3">

        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="isSubmitting()"
        >

          @if (isSubmitting()) {

            <span
              class="
                spinner-border
                spinner-border-sm
                me-2
              "
            ></span>

            Creating Account...

          } @else {

            Sign Up

          }

        </button>

      </div>

    </form>


    <div class="text-center small">

      Already have an account?

      <a
        routerLink="/auth/login"
        class="text-decoration-none fw-semibold"
      >
        Sign In
      </a>

    </div>

  </div>
</div>
