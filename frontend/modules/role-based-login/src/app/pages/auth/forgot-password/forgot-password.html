<div class="card shadow border-0">
  <div class="card-header bg-primary text-white text-center p-4 rounded-top">
    <h3 class="mb-0 fw-bold">Forgot Password</h3>
    <p class="small mb-0 text-white-50 mt-1">Enter your registered email address</p>
  </div>
  <div class="card-body p-4">

    <!-- Modern @if control flow [2] -->
    @if (successMessage()) {
      <div class="alert alert-success small" role="alert">
        {{ successMessage() }}
      </div>
    }
    @if (errorMessage()) {
      <div class="alert alert-danger small" role="alert">
        {{ errorMessage() }}
      </div>
    }

    @if (!successMessage()) {
      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="form-label fw-bold small">Registered Email *</label>
          <input type="email" class="form-control" formControlName="email" placeholder="admin@ssir.gov.ae">
        </div>

        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-primary btn-lg fs-6" [disabled]="isSubmitting() || forgotForm.invalid">
            @if (isSubmitting()) {
              <span class="spinner-border spinner-border-sm me-2" role="status"></span>
            }
            Send Reset Link
          </button>
        </div>
      </form>
    }

    <div class="text-center mt-3 small">
      <a routerLink="/auth/login" class="text-decoration-none fw-semibold">Back to Sign In</a>
    </div>

  </div>
</div>
